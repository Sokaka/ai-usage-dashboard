name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AiUsageDashboard.sln

      - name: Build
        run: dotnet build AiUsageDashboard.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test tests/AiUsageDashboard.Tests/AiUsageDashboard.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --maxcpucount:1
          --nodeReuse:false
          -p:UseSharedCompilation=false
          --collect "Code Coverage;Format=Cobertura"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "${{ runner.temp }}/test-results"
          --
          xUnit.ParallelizeTestCollections=false

      - name: Verify production line coverage
        shell: pwsh
        run: >
          ./tools/Assert-ProductionCoverage.ps1
          -ResultsDirectory "${{ runner.temp }}/test-results"
          -MinimumLineCoveragePercent 70

      - name: Verify internal package contract
        shell: pwsh
        run: |
          ./tools/Publish-Internal.ps1 `
            -Version "0.0.0-verify-ci.${{ github.run_number }}.${{ github.run_attempt }}" `
            -OutputRoot "${{ runner.temp }}/ai-usage-dashboard-package"

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-ci-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
          retention-days: 7
