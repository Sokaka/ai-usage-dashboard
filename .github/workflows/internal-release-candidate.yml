name: Release candidate

run-name: Candidate ${{ inputs.version }} from ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact final version without v or build metadata (for example, 0.2.0)
        required: true
        type: string
      expected_sha:
        description: Full 40-character commit SHA currently at main
        required: true
        type: string
      acknowledge_draft_candidate:
        description: Build a draft candidate; publication is a separate decision
        required: true
        default: false
        type: boolean
      release_sequence:
        description: New globally increasing sequence from the completed distribution audit
        required: true
        type: string
      previous_release_sequence:
        description: Audited maximum sequence from all previous distribution sources
        required: true
        type: string
      reuse_updater_from_tag:
        description: Optional latest public stable tag whose signed Updater is reused (for example, v1.0.8)
        required: false
        type: string
      acknowledge_sequence_audit:
        description: All known prior distribution sources were enumerated and the upper bound is complete
        required: true
        default: false
        type: boolean
      publish_github_prerelease:
        description: Required; save the verified six-file bundle as a draft prerelease with the final tag
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: internal-release-candidate
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source
        id: release_source
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DRAFT_CANDIDATE: ${{ inputs.acknowledge_draft_candidate }}
          CREATE_DRAFT_RELEASE: ${{ inputs.publish_github_prerelease }}
          RELEASE_SEQUENCE: ${{ inputs.release_sequence }}
          PREVIOUS_RELEASE_SEQUENCE: ${{ inputs.previous_release_sequence }}
          SEQUENCE_AUDIT: ${{ inputs.acknowledge_sequence_audit }}
        run: |
          $ErrorActionPreference = 'Stop'

          $rawVersion = $env:RELEASE_VERSION
          $version = $rawVersion.Trim()
          $expectedSha = $env:EXPECTED_SHA.Trim()
          $headSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect candidate source HEAD.' }

          if ($env:DRAFT_CANDIDATE -ne 'true') {
            throw 'The draft candidate acknowledgement must be selected.'
          }
          if ($env:CREATE_DRAFT_RELEASE -ne 'true') {
            throw 'Saving the verified candidate as a draft Release must be selected.'
          }

          [long] $releaseSequence = 0
          [long] $previousSequence = 0
          if (($env:SEQUENCE_AUDIT -ne 'true') -or
              ![long]::TryParse($env:RELEASE_SEQUENCE, [ref] $releaseSequence) -or
              ![long]::TryParse($env:PREVIOUS_RELEASE_SEQUENCE, [ref] $previousSequence) -or
              ($previousSequence -lt 0) -or ($releaseSequence -le $previousSequence)) {
            throw 'A complete sequence audit and a strictly greater external release sequence are required.'
          }

          if ($rawVersion -cne $version) {
            throw 'Version must not contain leading or trailing whitespace.'
          }

          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-(0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$') {
            throw "Version '$version' must be a semantic version without build metadata."
          }

          if ($expectedSha -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'expected_sha must be the full 40-character commit SHA.'
          }

          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Release candidates must be dispatched from main, not '$env:GITHUB_REF'."
          }

          if (($headSha -ne $expectedSha) -or ($headSha -ne $env:GITHUB_SHA)) {
            throw "Commit confirmation failed. Checked out $headSha; expected $expectedSha."
          }
          $remoteMain = @(git ls-remote origin refs/heads/main)
          if (($LASTEXITCODE -ne 0) -or ($remoteMain.Count -ne 1) -or
              ($remoteMain[0] -cnotmatch '^([0-9a-fA-F]{40})\s+refs/heads/main$') -or
              ($Matches[1] -cne $headSha)) {
            throw "Remote main does not point to candidate source $headSha."
          }

          $candidateVersion = $version
          $existingTag = git tag --list "v$candidateVersion"
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect existing release tags.'
          }
          if (![string]::IsNullOrWhiteSpace(($existingTag -join ''))) {
            throw "Tag v$candidateVersion already exists."
          }

          $workingTreeStatus = @(git status --porcelain=v1 --untracked-files=all)
          if (($LASTEXITCODE -ne 0) -or ($workingTreeStatus.Count -ne 0)) {
            throw 'The checked-out release source is not clean.'
          }

          "candidate_version=$candidateVersion" >> $env:GITHUB_OUTPUT
          "build_run_id=$env:GITHUB_RUN_ID" >> $env:GITHUB_OUTPUT
          "build_run_attempt=$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
          "Validated draft release candidate $candidateVersion from $headSha."

      - name: Require passing Windows CI for this main commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runsJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/windows-ci.yml/runs?head_sha=$env:GITHUB_SHA&event=push&status=success&per_page=100"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect Windows CI runs for $env:GITHUB_REPOSITORY at $env:GITHUB_SHA."
          }
          $runs = $runsJson | ConvertFrom-Json
          $passed = @($runs.workflow_runs | Where-Object {
            ($_.head_sha -ceq $env:GITHUB_SHA) -and
            ($_.head_branch -ceq 'main') -and
            ($_.event -ceq 'push') -and
            ($_.status -ceq 'completed') -and
            ($_.conclusion -ceq 'success')
          })
          if ($passed.Count -eq 0) {
            throw "Windows CI verify must pass for main commit $env:GITHUB_SHA before signing."
          }

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check Git history for secrets
        id: repository_history
        shell: pwsh
        run: |
          dotnet run --project tools/AiUsageDashboard.PrivacyCheck --configuration Release -- history `
            --repository $env:GITHUB_WORKSPACE --all
          if ($LASTEXITCODE -ne 0) { throw 'Git history privacy validation failed.' }

      - name: Prepare pinned public update keys
        shell: pwsh
        env:
          UPDATE_TRUST_JSON: ${{ vars.UPDATE_FEED_TRUST_JSON }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_TRUST_JSON)) {
            throw 'UPDATE_FEED_TRUST_JSON must be configured with externally provisioned production public keys.'
          }
          $trustPath = Join-Path $env:RUNNER_TEMP 'update-public-trust.json'
          [IO.File]::WriteAllText($trustPath, $env:UPDATE_TRUST_JSON, [Text.UTF8Encoding]::new($false))
          dotnet run --project tools/AiUsageDashboard.FeedSigning --configuration Release -- validate-trust --trust $trustPath
          if ($LASTEXITCODE -ne 0) { throw 'Update feed public trust validation failed.' }

      - name: Restore
        run: dotnet restore AiUsageDashboard.sln

      - name: Build
        run: dotnet build AiUsageDashboard.sln --configuration Release --no-restore

      - name: Test
        id: tests
        run: >
          dotnet test tests/AiUsageDashboard.Tests/AiUsageDashboard.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --maxcpucount:1
          --nodeReuse:false
          -p:UseSharedCompilation=false
          --collect "Code Coverage;Format=Cobertura"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "${{ runner.temp }}/test-results"
          --
          xUnit.ParallelizeTestCollections=false

      - name: Verify production line coverage
        shell: pwsh
        run: >
          ./tools/Assert-ProductionCoverage.ps1
          -ResultsDirectory "${{ runner.temp }}/test-results"
          -MinimumLineCoveragePercent 70

      - name: Download previously signed updater
        id: previous_updater
        if: ${{ inputs.reuse_updater_from_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_UPDATER_FROM_TAG: ${{ inputs.reuse_updater_from_tag }}
          RELEASE_VERSION: ${{ steps.release_source.outputs.candidate_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:REUSE_UPDATER_FROM_TAG
          if (($tag -cne $tag.Trim()) -or
              ($tag -cnotmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$')) {
            throw 'reuse_updater_from_tag must be an exact stable release tag such as v1.0.8.'
          }
          $previousVersion = [Management.Automation.SemanticVersion]::Parse($tag.Substring(1))
          $candidateVersion = [Management.Automation.SemanticVersion]::Parse($env:RELEASE_VERSION)
          if ($previousVersion.CompareTo($candidateVersion) -ge 0) {
            throw 'The reused updater release must precede the candidate version.'
          }

          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect the latest public release in $env:GITHUB_REPOSITORY."
          }
          $release = $releaseJson | ConvertFrom-Json
          if (($release.tag_name -cne $tag) -or $release.draft -or $release.prerelease) {
            throw "The requested updater source $tag is not the latest public stable release."
          }

          $previousRoot = Join-Path $env:RUNNER_TEMP 'previous-updater'
          New-Item -ItemType Directory -Path $previousRoot -ErrorAction Stop | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY `
            --pattern 'AiUsageDashboard-update-stable.json' `
            --pattern 'AiUsageDashboard-Updater-*-win-x64.exe' `
            --dir $previousRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to download the signed feed and updater from $tag."
          }
          $feedPath = Join-Path $previousRoot 'AiUsageDashboard-update-stable.json'
          $updaters = @(Get-ChildItem -LiteralPath $previousRoot -File |
            Where-Object { $_.Name -match '^AiUsageDashboard-Updater-.*-win-x64\.exe$' })
          $files = @(Get-ChildItem -LiteralPath $previousRoot -File)
          if (!(Test-Path -LiteralPath $feedPath -PathType Leaf) -or
              ($updaters.Count -ne 1) -or ($files.Count -ne 2)) {
            throw "The public release $tag did not provide exactly one feed and one updater."
          }
          "feed_path=$feedPath" >> $env:GITHUB_OUTPUT
          "updater_path=$($updaters[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Build and sign versioned update bundle
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_source.outputs.candidate_version }}
          RELEASE_SEQUENCE: ${{ inputs.release_sequence }}
          PREVIOUS_RELEASE_SEQUENCE: ${{ inputs.previous_release_sequence }}
          SIGNING_KEY_ID: ${{ vars.UPDATE_FEED_SIGNING_KEY_ID }}
          SIGNING_KEY_PEM: ${{ secrets.UPDATE_FEED_SIGNING_PRIVATE_KEY_PEM }}
          PREVIOUS_SIGNED_FEED_PATH: ${{ steps.previous_updater.outputs.feed_path }}
          PREVIOUS_UPDATER_PATH: ${{ steps.previous_updater.outputs.updater_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY_ID) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_KEY_PEM)) {
            throw 'The production signing key ID and private key secret are required.'
          }
          $signingRoot = Join-Path $env:RUNNER_TEMP ('.aud-signing-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $signingRoot | Out-Null
          $privateKeyPath = Join-Path $signingRoot 'private-key.pem'
          try {
            [IO.File]::WriteAllText($privateKeyPath, $env:SIGNING_KEY_PEM, [Text.UTF8Encoding]::new($false))
            Remove-Item Env:SIGNING_KEY_PEM
            $reuseArguments = @{}
            if (![string]::IsNullOrWhiteSpace($env:PREVIOUS_SIGNED_FEED_PATH)) {
              if ([string]::IsNullOrWhiteSpace($env:PREVIOUS_UPDATER_PATH)) {
                throw 'A reused updater requires both the previous signed feed and its updater EXE.'
              }
              $reuseArguments['PreviousSignedFeedPath'] = $env:PREVIOUS_SIGNED_FEED_PATH
              $reuseArguments['PreviousUpdaterPath'] = $env:PREVIOUS_UPDATER_PATH
            }
            ./tools/Publish-UpdateBundle.ps1 `
              -Version $env:RELEASE_VERSION `
              -ReleaseSequence $env:RELEASE_SEQUENCE `
              -PreviousReleaseSequence $env:PREVIOUS_RELEASE_SEQUENCE `
              -TrustedKeysFile (Join-Path $env:RUNNER_TEMP 'update-public-trust.json') `
              -SigningKeyId $env:SIGNING_KEY_ID `
              -SigningPrivateKeyFile $privateKeyPath `
              -Channel stable `
              -FeedUrl 'https://github.com/Sokaka/ai-usage-dashboard/releases/latest/download/AiUsageDashboard-update-stable.json' `
              -AssetBaseUrl "https://github.com/Sokaka/ai-usage-dashboard/releases/download/v$env:RELEASE_VERSION" `
              -OutputRoot (Join-Path $env:RUNNER_TEMP 'internal-release') `
              @reuseArguments
          }
          finally {
            if (Test-Path -LiteralPath $privateKeyPath) { Remove-Item -LiteralPath $privateKeyPath -Force }
            Remove-Item -LiteralPath $signingRoot
          }

      - name: Verify update bundle
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_source.outputs.candidate_version }}
          RELEASE_SEQUENCE: ${{ inputs.release_sequence }}
          PREVIOUS_RELEASE_SEQUENCE: ${{ inputs.previous_release_sequence }}
          PREVIOUS_SIGNED_FEED_PATH: ${{ steps.previous_updater.outputs.feed_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $releaseRoot = '${{ runner.temp }}/internal-release'
          $packageName = "AiUsageDashboard-$env:RELEASE_VERSION-win-x64"
          $zipPath = Join-Path $releaseRoot "$packageName.zip"
          $checksumPath = "$zipPath.sha256"
          $updaters = @(Get-ChildItem -LiteralPath $releaseRoot -File |
            Where-Object { $_.Name -match '^AiUsageDashboard-Updater-.*-win-x64\.exe$' })
          if ($updaters.Count -ne 1) {
            throw 'The update bundle must contain exactly one Updater EXE.'
          }
          $updaterName = $updaters[0].Name
          $updaterPath = $updaters[0].FullName
          $updaterChecksumPath = "$updaterPath.sha256"
          $feedPath = Join-Path $releaseRoot 'AiUsageDashboard-update-stable.json'
          $feedChecksumPath = "$feedPath.sha256"
          $checksumText = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          $updaterChecksumText = (Get-Content -LiteralPath $updaterChecksumPath -Raw).Trim()
          $feedChecksumText = (Get-Content -LiteralPath $feedChecksumPath -Raw).Trim()

          $bundleEntries = @(Get-ChildItem -LiteralPath $releaseRoot -Force)
          if (($bundleEntries.Count -ne 6) -or
              (@($bundleEntries | Where-Object { !$_.PSIsContainer }).Count -ne 6)) {
            throw 'The update bundle must contain exactly six files.'
          }

          if ($checksumText -notmatch '^([0-9a-f]{64})  (.+\.zip)$') {
            throw 'The generated checksum file has an invalid format.'
          }

          $expectedHash = $Matches[1]
          $expectedFileName = $Matches[2]
          $actualHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($updaterChecksumText -notmatch '^([0-9a-f]{64})  (.+\.exe)$') {
            throw 'The generated updater checksum file has an invalid format.'
          }

          $expectedUpdaterHash = $Matches[1]
          $expectedUpdaterFileName = $Matches[2]
          $actualUpdaterHash = (Get-FileHash -LiteralPath $updaterPath -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($feedChecksumText -notmatch '^([0-9a-f]{64})  (.+\.json)$') {
            throw 'The generated feed checksum file has an invalid format.'
          }

          $expectedFeedHash = $Matches[1]
          $expectedFeedFileName = $Matches[2]
          $actualFeedHash = (Get-FileHash -LiteralPath $feedPath -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($expectedFileName -ne (Split-Path -Leaf $zipPath)) {
            throw "Checksum names '$expectedFileName', not the generated ZIP."
          }
          if ($expectedHash -ne $actualHash) {
            throw "Package checksum mismatch: expected $expectedHash; got $actualHash."
          }
          if ($expectedUpdaterFileName -ne (Split-Path -Leaf $updaterPath)) {
            throw "Updater checksum names '$expectedUpdaterFileName', not the generated EXE."
          }
          if ($expectedUpdaterHash -ne $actualUpdaterHash) {
            throw "Updater checksum mismatch: expected $expectedUpdaterHash; got $actualUpdaterHash."
          }
          if ($expectedFeedFileName -ne (Split-Path -Leaf $feedPath)) {
            throw "Feed checksum names '$expectedFeedFileName', not the generated JSON."
          }
          if ($expectedFeedHash -ne $actualFeedHash) {
            throw "Feed checksum mismatch: expected $expectedFeedHash; got $actualFeedHash."
          }

          $verifiedPayloadPath = Join-Path $env:RUNNER_TEMP ('verified-feed-' + [Guid]::NewGuid().ToString('N') + '.json')
          dotnet run --project tools/AiUsageDashboard.FeedSigning --configuration Release -- verify `
            --feed $feedPath --trust (Join-Path $env:RUNNER_TEMP 'update-public-trust.json') `
            --channel stable --output $verifiedPayloadPath
          if ($LASTEXITCODE -ne 0) { throw 'Candidate feed signature verification failed.' }
          $feed = Get-Content -LiteralPath $verifiedPayloadPath -Raw | ConvertFrom-Json
          $expectedUpdaterVersion = $env:RELEASE_VERSION
          $expectedUpdaterSource = $env:GITHUB_SHA
          if (![string]::IsNullOrWhiteSpace($env:PREVIOUS_SIGNED_FEED_PATH)) {
            $previousPayloadPath = Join-Path $env:RUNNER_TEMP ('verified-previous-' + [Guid]::NewGuid().ToString('N') + '.json')
            dotnet run --project tools/AiUsageDashboard.FeedSigning --configuration Release --no-build -- verify `
              --feed $env:PREVIOUS_SIGNED_FEED_PATH --trust (Join-Path $env:RUNNER_TEMP 'update-public-trust.json') `
              --channel stable --output $previousPayloadPath
            if ($LASTEXITCODE -ne 0) { throw 'Previous updater feed signature verification failed.' }
            $previousFeed = Get-Content -LiteralPath $previousPayloadPath -Raw | ConvertFrom-Json
            if (($previousFeed.releaseSequence -gt [long]$env:PREVIOUS_RELEASE_SEQUENCE) -or
                ($previousFeed.updater.fileName -cne $updaterName) -or
                ($previousFeed.updater.sizeBytes -ne (Get-Item -LiteralPath $updaterPath).Length) -or
                ($previousFeed.updater.sha256 -cne $actualUpdaterHash)) {
              throw 'The reused updater does not match the previous signed feed.'
            }
            $expectedUpdaterVersion = $previousFeed.updater.version
            $expectedUpdaterSource = $previousFeed.updater.sourceRevision
          }
          $expectedAssetBaseUrl = "https://github.com/Sokaka/ai-usage-dashboard/releases/download/v$env:RELEASE_VERSION"
          if (($feed.schemaVersion -ne 1) -or
              ($feed.channel -cne 'stable') -or
              ($feed.releaseSequence -ne [long]$env:RELEASE_SEQUENCE) -or
              ($feed.minimumUpdaterVersion -cne $expectedUpdaterVersion) -or
              ($feed.package.artifactId -cne 'AiUsageDashboard') -or
              ($feed.package.version -cne $env:RELEASE_VERSION) -or
              ($feed.package.runtimeIdentifier -cne 'win-x64') -or
              ($feed.package.fileName -cne (Split-Path -Leaf $zipPath)) -or
              ($feed.package.downloadUrl -cne "$expectedAssetBaseUrl/$(Split-Path -Leaf $zipPath)") -or
              ($feed.package.sizeBytes -ne (Get-Item -LiteralPath $zipPath).Length) -or
              ($feed.package.sha256 -cne $actualHash) -or
              ($feed.updater.artifactId -cne 'AiUsageDashboard.Updater') -or
              ($feed.updater.version -cne $expectedUpdaterVersion) -or
              ($feed.updater.runtimeIdentifier -cne 'win-x64') -or
              ($feed.updater.fileName -cne (Split-Path -Leaf $updaterPath)) -or
              ($feed.updater.downloadUrl -cne "$expectedAssetBaseUrl/$(Split-Path -Leaf $updaterPath)") -or
              ($feed.updater.sizeBytes -ne (Get-Item -LiteralPath $updaterPath).Length) -or
              ($feed.updater.sha256 -cne $actualUpdaterHash) -or
              ($feed.package.sourceRevision -cne $env:GITHUB_SHA) -or
              ($feed.updater.sourceRevision -cne $expectedUpdaterSource)) {
            throw 'Update feed does not match the generated package, updater, or source.'
          }

          @"
          ## Draft release candidate

          - Version: ``$env:RELEASE_VERSION``
          - Commit: ``$env:GITHUB_SHA``
          - Package SHA-256: ``$actualHash``
          - Updater SHA-256: ``$actualUpdaterHash``
          - Feed SHA-256: ``$actualFeedHash``
          - Feed: ``AiUsageDashboard-update-stable.json``
          - Result: verified candidate on runner; draft Release requested
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Reverify and freeze draft candidate
        id: candidate_release
        if: ${{ inputs.publish_github_prerelease }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_source.outputs.candidate_version }}
          BUILD_RUN_ID: ${{ steps.release_source.outputs.build_run_id }}
          BUILD_RUN_ATTEMPT: ${{ steps.release_source.outputs.build_run_attempt }}
          RELEASE_SEQUENCE: ${{ inputs.release_sequence }}
          PREVIOUS_RELEASE_SEQUENCE: ${{ inputs.previous_release_sequence }}
          PREVIOUS_SIGNED_FEED_PATH: ${{ steps.previous_updater.outputs.feed_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (($env:BUILD_RUN_ID -cne $env:GITHUB_RUN_ID) -or
              ($env:BUILD_RUN_ATTEMPT -cne $env:GITHUB_RUN_ATTEMPT)) {
            throw 'Candidate build run identity changed before draft creation.'
          }
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'internal-release'
          $packageName = "AiUsageDashboard-$env:RELEASE_VERSION-win-x64.zip"
          $updaters = @(Get-ChildItem -LiteralPath $releaseRoot -File |
            Where-Object { $_.Name -match '^AiUsageDashboard-Updater-.*-win-x64\.exe$' })
          if ($updaters.Count -ne 1) {
            throw 'Candidate output must contain exactly one Updater EXE.'
          }
          $updaterName = $updaters[0].Name
          $feedName = 'AiUsageDashboard-update-stable.json'
          $expectedNames = @(
            $packageName,
            "$packageName.sha256",
            $updaterName,
            "$updaterName.sha256",
            $feedName,
            "$feedName.sha256"
          )
          $entries = @(Get-ChildItem -LiteralPath $releaseRoot -Force)
          $files = @($entries | Where-Object { !$_.PSIsContainer })
          $actualNames = @($files.Name | Sort-Object)
          if (($entries.Count -ne 6) -or ($files.Count -ne 6) -or
              (Compare-Object ($expectedNames | Sort-Object) $actualNames)) {
            throw 'Candidate output does not contain the exact six release files.'
          }

          $verifiedHashes = @{}
          foreach ($fileName in @($packageName, $updaterName, $feedName)) {
            $filePath = Join-Path $releaseRoot $fileName
            $sidecarPath = "$filePath.sha256"
            $sidecar = ([IO.File]::ReadAllText($sidecarPath)).Trim()
            if ($sidecar -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "Checksum sidecar has an invalid format: $sidecarPath"
            }

            $expectedHash = $Matches[1]
            $sidecarName = $Matches[2]
            $actualHash = (Get-FileHash `
              -LiteralPath $filePath `
              -Algorithm SHA256).Hash.ToLowerInvariant()
            if (($sidecarName -cne $fileName) -or
                ($expectedHash -cne $actualHash)) {
              throw "Checksum verification failed for $fileName."
            }

            $verifiedHashes[$fileName] = $actualHash
          }

          $packagePath = Join-Path $releaseRoot $packageName
          $updaterPath = Join-Path $releaseRoot $updaterName
          $feedPath = Join-Path $releaseRoot $feedName
          $verifiedPayloadPath = Join-Path $env:RUNNER_TEMP ('verified-feed-' + [Guid]::NewGuid().ToString('N') + '.json')
          dotnet run --project tools/AiUsageDashboard.FeedSigning --configuration Release -- verify `
            --feed $feedPath --trust (Join-Path $env:RUNNER_TEMP 'update-public-trust.json') `
            --channel stable --output $verifiedPayloadPath
          if ($LASTEXITCODE -ne 0) { throw 'Candidate feed signature verification failed.' }
          $feed = Get-Content -LiteralPath $verifiedPayloadPath -Raw | ConvertFrom-Json
          $expectedUpdaterVersion = $env:RELEASE_VERSION
          $expectedUpdaterSource = $env:GITHUB_SHA
          if (![string]::IsNullOrWhiteSpace($env:PREVIOUS_SIGNED_FEED_PATH)) {
            $previousPayloadPath = Join-Path $env:RUNNER_TEMP ('verified-previous-freeze-' + [Guid]::NewGuid().ToString('N') + '.json')
            dotnet run --project tools/AiUsageDashboard.FeedSigning --configuration Release --no-build -- verify `
              --feed $env:PREVIOUS_SIGNED_FEED_PATH --trust (Join-Path $env:RUNNER_TEMP 'update-public-trust.json') `
              --channel stable --output $previousPayloadPath
            if ($LASTEXITCODE -ne 0) { throw 'Previous updater feed signature verification failed.' }
            $previousFeed = Get-Content -LiteralPath $previousPayloadPath -Raw | ConvertFrom-Json
            if (($previousFeed.releaseSequence -gt [long]$env:PREVIOUS_RELEASE_SEQUENCE) -or
                ($previousFeed.updater.fileName -cne $updaterName) -or
                ($previousFeed.updater.sizeBytes -ne (Get-Item -LiteralPath $updaterPath).Length) -or
                ($previousFeed.updater.sha256 -cne $verifiedHashes[$updaterName])) {
              throw 'The reused updater changed before candidate freezing.'
            }
            $expectedUpdaterVersion = $previousFeed.updater.version
            $expectedUpdaterSource = $previousFeed.updater.sourceRevision
          }
          $expectedAssetBaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:RELEASE_VERSION"
          if (($feed.schemaVersion -ne 1) -or
              ($feed.channel -cne 'stable') -or
              ($feed.releaseSequence -ne [long]$env:RELEASE_SEQUENCE) -or
              ($feed.minimumUpdaterVersion -cne $expectedUpdaterVersion) -or
              ($feed.package.version -cne $env:RELEASE_VERSION) -or
              ($feed.package.fileName -cne $packageName) -or
              ($feed.package.downloadUrl -cne "$expectedAssetBaseUrl/$packageName") -or
              ($feed.package.sizeBytes -ne (Get-Item -LiteralPath $packagePath).Length) -or
              ($feed.package.sha256 -cne $verifiedHashes[$packageName]) -or
              ($feed.package.sourceRevision -cne $env:GITHUB_SHA) -or
              ($feed.updater.version -cne $expectedUpdaterVersion) -or
              ($feed.updater.fileName -cne $updaterName) -or
              ($feed.updater.downloadUrl -cne "$expectedAssetBaseUrl/$updaterName") -or
              ($feed.updater.sizeBytes -ne (Get-Item -LiteralPath $updaterPath).Length) -or
              ($feed.updater.sha256 -cne $verifiedHashes[$updaterName]) -or
              ($feed.updater.sourceRevision -cne $expectedUpdaterSource)) {
            throw 'Candidate feed no longer matches the verified release files.'
          }

          $tag = "v$env:RELEASE_VERSION"
          $notesPath = Join-Path $env:RUNNER_TEMP 'draft-candidate-notes.md'
          $notes = @"
          Draft release candidate built from ``$env:GITHUB_SHA`` by
          [workflow run $env:BUILD_RUN_ID, attempt $env:BUILD_RUN_ATTEMPT](https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID/attempts/$env:BUILD_RUN_ATTEMPT).
          Release sequence: $env:RELEASE_SEQUENCE. These exact six assets are the candidate for a later publication decision.

          Download all six assets from this Release for verification and offline recovery.
          The standalone updater cannot download draft assets before public promotion.
          "@
          [IO.File]::WriteAllText(
            $notesPath,
            $notes,
            [Text.UTF8Encoding]::new($false))
          $assets = @($files | Sort-Object Name | Select-Object -ExpandProperty FullName)

          $repository = gh api "repos/$env:GITHUB_REPOSITORY" | ConvertFrom-Json
          if (($LASTEXITCODE -ne 0) -or ($repository.private -ne $false)) {
            throw 'Draft candidate creation requires a public repository.'
          }
          $remoteMain = @(git ls-remote origin refs/heads/main)
          if (($LASTEXITCODE -ne 0) -or ($remoteMain.Count -ne 1) -or
              ($remoteMain[0] -cnotmatch '^([0-9a-fA-F]{40})\s+refs/heads/main$') -or
              ($Matches[1] -cne $env:GITHUB_SHA)) {
            throw "Remote main moved away from candidate source $env:GITHUB_SHA before draft creation."
          }
          $existingRemoteTag = @(git ls-remote origin "refs/tags/$tag")
          if (($LASTEXITCODE -ne 0) -or ($existingRemoteTag.Count -ne 0)) {
            throw "Release tag $tag already exists or cannot be checked in $env:GITHUB_REPOSITORY."
          }

          gh release create $tag @assets `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "AI Usage $env:RELEASE_VERSION candidate" `
            --notes-file $notesPath `
            --prerelease `
            --draft
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create draft prerelease $tag."
          }

          $releaseJson = gh release view $tag `
            --repo $env:GITHUB_REPOSITORY `
            --json 'databaseId,assets,isDraft,isPrerelease,tagName,targetCommitish,url'
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect draft prerelease $tag in $env:GITHUB_REPOSITORY (exit $LASTEXITCODE)."
          }
          $release = $releaseJson | ConvertFrom-Json
          [long] $releaseId = 0
          if (([string] $release.databaseId -cnotmatch '\A[1-9][0-9]*\z') -or
              ![long]::TryParse([string] $release.databaseId, [ref] $releaseId)) {
            throw "Draft prerelease $tag in $env:GITHUB_REPOSITORY has no valid numeric Release ID."
          }
          if (!$release.isDraft -or
              !$release.isPrerelease -or
              ($release.tagName -cne $tag) -or
              ($release.targetCommitish -cne $env:GITHUB_SHA) -or
              ($release.assets.Count -ne 6)) {
            throw "Draft prerelease $tag (Release $releaseId) in $env:GITHUB_REPOSITORY does not match source $env:GITHUB_SHA and the requested six assets."
          }

          $viewAssetIds = @{}
          $assetApiPrefix = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/"
          foreach ($file in $files) {
            $remoteAsset = @($release.assets | Where-Object {
              $_.name -ceq $file.Name
            })
            $localDigest = 'sha256:' + (Get-FileHash `
              -LiteralPath $file.FullName `
              -Algorithm SHA256).Hash.ToLowerInvariant()
            $assetApiUrl = if ($remoteAsset.Count -eq 1) { [string] $remoteAsset[0].apiUrl } else { '' }
            $assetIdText = if ($assetApiUrl.StartsWith($assetApiPrefix, [StringComparison]::Ordinal)) {
              $assetApiUrl.Substring($assetApiPrefix.Length)
            } else { '' }
            [long] $remoteAssetId = 0
            if (($remoteAsset.Count -ne 1) -or
                ($assetIdText -cnotmatch '\A[1-9][0-9]*\z') -or
                ![long]::TryParse($assetIdText, [ref] $remoteAssetId) -or
                ($remoteAsset[0].size -ne $file.Length) -or
                ($remoteAsset[0].digest -cne $localDigest)) {
              throw "Uploaded Release asset verification failed for $($file.Name)."
            }
            $viewAssetIds[$file.Name] = $remoteAssetId
          }

          $freezeJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read back draft Release $releaseId ($tag) in $env:GITHUB_REPOSITORY (exit $LASTEXITCODE)."
          }
          $freeze = $freezeJson | ConvertFrom-Json
          if (([string] $freeze.id -cne [string] $releaseId) -or
              !$freeze.draft -or !$freeze.prerelease -or
              ($freeze.tag_name -cne $tag) -or ($freeze.target_commitish -cne $env:GITHUB_SHA) -or
              ($freeze.assets.Count -ne 6)) {
            throw "Draft Release $releaseId ($tag) in $env:GITHUB_REPOSITORY changed identity, draft state, source $env:GITHUB_SHA, or its six-asset set before freezing."
          }
          foreach ($file in $files) {
            $frozenAsset = @($freeze.assets | Where-Object { $_.name -ceq $file.Name })
            $localDigest = 'sha256:' + (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if (($frozenAsset.Count -ne 1) -or
                ([string] $frozenAsset[0].id -cne [string] $viewAssetIds[$file.Name]) -or
                ($frozenAsset[0].size -ne $file.Length) -or
                ($frozenAsset[0].digest -cne $localDigest)) {
              throw "Candidate asset changed before freezing its identity: $($file.Name)."
            }
          }
          $sidecarAsset = @($freeze.assets | Where-Object {
            $_.name -ceq 'AiUsageDashboard-update-stable.json.sha256'
          })
          $draftAssetUrl = if ($sidecarAsset.Count -eq 1) {
            [string] $sidecarAsset[0].browser_download_url
          } else { '' }
          $expectedAssetUrl = '\Ahttps://github\.com/' +
            [regex]::Escape($env:GITHUB_REPOSITORY) +
            '/releases/download/[A-Za-z0-9._-]+/AiUsageDashboard-update-stable\.json\.sha256\z'
          if ($draftAssetUrl -cnotmatch $expectedAssetUrl) {
            throw "Draft Release $releaseId has no valid browser URL for its feed checksum asset."
          }
          $receipt = [ordered] @{
            repository = "https://github.com/$env:GITHUB_REPOSITORY"
            repositoryId = $repository.id
            releaseId = $freeze.id
            releaseUrl = $freeze.html_url
            tag = $tag
            sourceSha = $env:GITHUB_SHA
            buildRunId = $env:BUILD_RUN_ID
            buildRunAttempt = $env:BUILD_RUN_ATTEMPT
            releaseSequence = [long] $env:RELEASE_SEQUENCE
            assets = @($freeze.assets | ForEach-Object {
              [ordered] @{ id = $_.id; name = $_.name; size = $_.size; digest = $_.digest }
            })
          }
          $receiptPath = Join-Path $env:RUNNER_TEMP 'candidate-freeze.json'
          [IO.File]::WriteAllText($receiptPath, ($receipt | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
          "release_id=$releaseId" >> $env:GITHUB_OUTPUT
          "draft_asset_url=$draftAssetUrl" >> $env:GITHUB_OUTPUT
          "Draft candidate frozen at $($freeze.html_url); six asset identities and digests recorded. Public promotion must reuse these exact assets without rebuilding." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Verify draft is unavailable anonymously
        if: steps.candidate_release.outcome == 'success'
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.candidate_release.outputs.release_id }}
          DRAFT_ASSET_URL: ${{ steps.candidate_release.outputs.draft_asset_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          [long] $releaseId = 0
          if (($env:RELEASE_ID -cnotmatch '\A[1-9][0-9]*\z') -or
              ![long]::TryParse($env:RELEASE_ID, [ref] $releaseId)) {
            throw 'Draft Release has no valid ID for anonymous access verification.'
          }
          $apiUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$releaseId"
          $expectedAssetUrl = '\Ahttps://github\.com/' +
            [regex]::Escape($env:GITHUB_REPOSITORY) +
            '/releases/download/[A-Za-z0-9._-]+/AiUsageDashboard-update-stable\.json\.sha256\z'
          if ($env:DRAFT_ASSET_URL -cnotmatch $expectedAssetUrl) {
            throw 'Draft Release has no valid browser URL for anonymous access verification.'
          }
          $assetUrl = $env:DRAFT_ASSET_URL
          foreach ($request in @(@{ url = $apiUrl; method = 'Get' }, @{ url = $assetUrl; method = 'Head' })) {
            $response = Invoke-WebRequest -Uri $request.url -Method $request.method -MaximumRedirection 0 -SkipHttpErrorCheck
            if ([int] $response.StatusCode -ne 404) {
              throw "Draft candidate is anonymously accessible or returned an unexpected response: $($request.url), HTTP $([int] $response.StatusCode)."
            }
          }

      - name: Save candidate identity receipt
        if: always() && steps.candidate_release.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-freeze.json
          if-no-files-found: error
          retention-days: 14

      - name: Prepare checked test diagnostics on failure
        id: diagnostic_preparation
        if: failure() && steps.repository_history.outcome == 'success' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        shell: pwsh
        run: |
          dotnet run --project tools/AiUsageDashboard.PrivacyCheck --configuration Release --no-build --no-restore -- diagnostics `
            --input (Join-Path $env:RUNNER_TEMP 'test-results') `
            --output (Join-Path $env:RUNNER_TEMP 'safe-test-diagnostics')
          if ($LASTEXITCODE -ne 0) { throw 'Test diagnostics privacy validation failed; upload is blocked.' }

      - name: Upload test diagnostics on failure
        if: failure() && steps.diagnostic_preparation.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: internal-release-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/safe-test-diagnostics
          if-no-files-found: ignore
          retention-days: 7
